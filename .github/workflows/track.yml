name: track

# GitHub's cron scheduler is unreliable (it skipped every slot on Oct 19), so each run is a
# long-lived loop: it runs the tracker every 10 minutes for ~5h45m, then re-dispatches itself.
# The tracker decides which counties are due, using data/hours.csv, so extra loops are harmless.
# The cron entries below only restart the chain if it ever breaks; the concurrency group keeps
# at most one loop running and one waiting.
on:
  schedule:
    - cron: "7 * 19-31 10 *"
    - cron: "7 * 1-2 11 *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Track every 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tx-early-vote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 20700))   # 5h45m, under the 6h job limit
          while [ $SECONDS -lt $end ]; do
            git pull --rebase --quiet || true
            python -m tracker.run all || echo "::error::tracker run failed at $(TZ=America/Chicago date '+%-I:%M %p CT')"
            if [ -s holds.md ]; then
              gh issue create --title "Held readings — $(TZ=America/Chicago date '+%b %-d, %-I:%M %p CT')" --body-file holds.md || true
              rm -f holds.md
            fi
            git add data docs
            if ! git diff --cached --quiet; then
              git commit -m "data: $(TZ=America/Chicago date -Iseconds)" --quiet
              git pull --rebase --quiet && git push --quiet || echo "::warning::push failed; will retry next loop"
            fi
            sleep 600
          done

      - name: Hand off to the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=America/Chicago date +%Y%m%d)" -le 20261102 ]; then
            gh workflow run track.yml --ref main
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Early Vote Live</title>
<meta name="description" content="2026 Texas early in-person turnout by county, compared with the same day of early voting in 2024, 2022 and 2018.">
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1b1d21; --muted:#5f646d; --faint:#8b9099; --line:#e3e1da; --grid:#eeece6;
  --y2026:#1f4fd1; --y2026-soft:#7f9be6; --y2024:#c2410c; --y2022:#0f766e; --y2018:#7c3aed;
  --held:#b45309; --held-bg:#fff4e0; --nodata:#b91c1c; --nodata-bg:#fdecec; --ok:#15803d; --ok-bg:#e8f6ec;
  --up:#15803d; --down:#b91c1c; --stripe:rgba(180,83,9,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121417; --panel:#1a1d21; --ink:#eceae4; --muted:#a3a8b0; --faint:#7c818a; --line:#2c3036; --grid:#23272c;
  --y2026:#7aa2ff; --y2026-soft:#3f5fae; --y2024:#fb923c; --y2022:#2dd4bf; --y2018:#b794f6;
  --held:#f5a524; --held-bg:#2e2412; --nodata:#f87171; --nodata-bg:#331a1a; --ok:#4ade80; --ok-bg:#15291c;
  --up:#4ade80; --down:#f87171; --stripe:rgba(245,165,36,.18);
}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1a1d21; --ink:#eceae4; --muted:#a3a8b0; --faint:#7c818a; --line:#2c3036; --grid:#23272c;
  --y2026:#7aa2ff; --y2026-soft:#3f5fae; --y2024:#fb923c; --y2022:#2dd4bf; --y2018:#b794f6;
  --held:#f5a524; --held-bg:#2e2412; --nodata:#f87171; --nodata-bg:#331a1a; --ok:#4ade80; --ok-bg:#15291c;
  --up:#4ade80; --down:#f87171; --stripe:rgba(245,165,36,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:18px 24px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
header .meta{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow:hidden}
aside input,aside select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.list{overflow:auto;flex:1;margin:0 -6px;padding:0 6px}
.list button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 8px;border:0;border-radius:6px;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.list button:hover{background:var(--grid)}
.list button[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.list .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px}
.tag{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.held{background:var(--held)} .dot.nodata{background:var(--nodata)}
main{padding:22px 28px 60px;max-width:1120px;width:100%;min-width:0}
.panel{overflow-x:auto}
.title{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:4px}
.title h2{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.badge{font-size:12px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.badge.ok{color:var(--ok);background:var(--ok-bg)} .badge.held{color:var(--held);background:var(--held-bg)} .badge.nodata{color:var(--nodata);background:var(--nodata-bg)}
.badge.flag{color:var(--held);background:transparent;border:1px dashed var(--held)}
.grid{display:grid;grid-template-columns:minmax(220px,1.1fr) repeat(3,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card.held{border:2px solid var(--held)} .card.nodata{border:2px solid var(--nodata)}
.card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.card.held .v{color:var(--faint)}
.card .s{font-size:12.5px;color:var(--muted)}
.cmp .v{font-size:22px}
.delta{font-weight:700} .delta.up{color:var(--up)} .delta.down{color:var(--down)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.panel h3{font-size:14px;margin:0 0 2px} .panel .hint{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chips button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
tr.held td{background:var(--held-bg)} tr.nodata td{background:var(--nodata-bg)}
.notice{border-left:3px solid var(--held);background:var(--held-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:16px}
.notice.red{border-color:var(--nodata);background:var(--nodata-bg)}
.foot{color:var(--muted);font-size:12.5px;line-height:1.6}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
td input[type=checkbox]{accent-color:var(--y2026);margin:0;cursor:pointer}
.theme{margin-left:auto;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
/* live counties panel */
.live-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.lede{font-size:16.5px;line-height:1.5;margin:8px 0 14px;max-width:62em;text-wrap:pretty}
.lede b{font-variant-numeric:tabular-nums}
.live-ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--bg)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.sorter{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--faint)}
.sorter span{margin-right:2px}
.sorter button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;padding:3px 7px;border-radius:5px;cursor:pointer}
.sorter button[aria-pressed="true"]{color:var(--ink);background:var(--grid);font-weight:600}
.seg button:focus-visible,.sorter button:focus-visible,.chips button:focus-visible{outline:2px solid var(--y2026);outline-offset:1px}
.comp{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:12px 0 6px;gap:2px}
.comp div{display:flex;align-items:center;min-width:3px;overflow:hidden}
.comp span{color:var(--panel);font-size:12px;font-weight:700;padding:0 8px;white-space:nowrap}
.lrow{display:grid;grid-template-columns:26px minmax(170px,1.15fr) minmax(170px,2fr) 76px;grid-template-areas:"pick who bar big";gap:4px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow .pick{grid-area:pick;display:flex;align-self:start;padding-top:3px}
.lrow .who{grid-area:who;min-width:0} .lrow .barcol{grid-area:bar;min-width:0} .lrow .big{grid-area:big;text-align:right;font-size:21px;font-weight:700;letter-spacing:-.01em}
.lrow .who a{font-weight:650;font-size:15px;text-decoration:none} .lrow .who a:hover{text-decoration:underline}
.lrow .who .badge{margin-left:8px;font-size:10.5px;padding:1px 6px}
.lrow .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.lrow.off .who a,.lrow.off .big,.lrow.off .meta,.lrow.off .track{opacity:.5}
.lrow.lhdr{padding:4px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.lrow.lhdr .big{font-size:11px;font-weight:600}
.lrow.lhdr .barcol{display:flex;justify-content:space-between;text-transform:none;letter-spacing:0}
.lrow.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.lrow.total .who{font-weight:700}
.track{position:relative;height:14px;border-radius:7px;background:var(--grid)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--y2026);transition:width .35s ease}
.tick{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--y2024);box-shadow:0 0 0 1.5px var(--panel)}
.tick.reg{background:var(--muted)}
.note{margin-top:5px;min-height:16px}
.pace{font-size:12.5px;color:var(--muted)}
.pace.up{color:var(--up);font-weight:600} .pace.down{color:var(--down);font-weight:600} .pace.prog{color:var(--ink)}
.pol{display:inline-flex;align-items:center;gap:5px}
.pol i,.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pol.open{color:var(--ok);font-weight:600} .pol.open i,.dotlive{background:var(--ok);animation:pulse 2s infinite}
.dotlive{margin-right:6px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pol.open i,.dotlive{animation:none}.fill{transition:none}}
.legend .sw{display:inline-block;vertical-align:-2px;margin-right:6px}
.legend .sw.fill{position:static;width:16px;height:10px;border-radius:3px}
.legend .sw.tick{position:static;width:3px;height:13px;margin:0 6px 0 2px;box-shadow:none}
details.how{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
details.how summary{cursor:pointer;color:var(--muted);font-weight:600}
details.how ul{margin:8px 0 0;padding-left:20px;line-height:1.55;max-width:62em}
details.how li{margin-bottom:4px}
@media (max-width:620px){
  .lrow{grid-template-columns:24px 1fr 66px;grid-template-areas:"pick who big" ". bar bar"}
  .lrow.lhdr .barcol{display:none}
  .lede{font-size:15.5px}
  .seg button{padding:6px 10px}
}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .list{max-height:220px}
  main{padding:16px}
  header{padding:14px 16px}
  .grid{grid-template-columns:1fr 1fr}
  .grid .now{grid-column:1/-1}
}
</style>
</head>
<body>
<header>
  <h1>Texas Early Vote, Live</h1>
  <span class="meta" id="meta">Loading…</span>
  <button class="theme" id="theme" type="button">Theme</button>
</header>
<div class="wrap">
  <aside>
    <input id="q" type="search" placeholder="Search 254 counties" aria-label="Search counties">
    <select id="filter" aria-label="Filter counties">
      <option value="all">All counties</option>
      <option value="intraday">Intraday counties</option>
      <option value="held">Only counties with held data</option>
    </select>
    <div class="list" id="list" role="list"></div>
  </aside>
  <main id="main"><div class="empty">Loading data…</div></main>
</div>
<script>
const YEARS = [2024, 2022, 2018];
const COLOR = y => `var(--y${y})`;
const fmt = n => n == null ? "—" : n.toLocaleString("en-US");
const pct = (a, b) => (a - b) / b;
const fmtPct = p => (p >= 0 ? "+" : "−") + Math.abs(p * 100).toFixed(1) + "%";
const tfmt = iso => new Date(iso).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/Chicago"});
const dfmt = iso => new Date(iso).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/Chicago"});
const dayOf = iso => { const d = new Date(new Date(iso).toLocaleString("en-US", {timeZone: "America/Chicago"})); return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 19)) / 864e5) + 1; };
const minsCT = iso => { const p = new Date(iso).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/Chicago"}).split(":"); return +p[0] * 60 + +p[1]; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const title = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

let D, sel = "STATEWIDE", dayPick = null;
let t2Mode = "reg", t2Off = new Set(), t2Sort = "votes", howOpen = false;   // live-counties panel state

// ---------- status ----------
function status(c) {
  if (c.tier === 2) {
    const I = c.intraday, last = I.readings.at(-1);
    const lastT = last ? new Date(last.scraped) : 0;
    const heldAfter = I.held.filter(h => new Date(h.scraped) > lastT);
    if (heldAfter.length) return {kind: "held", n: heldAfter.length, since: last && last.t, items: heldAfter};
    if (I.last_attempt && I.last_attempt.status === "no_data") return {kind: "nodata", since: I.last_attempt.t, detail: I.last_attempt.detail};
  }
  const lastDay = lastIdx(c.daily) + 1;
  const dh = c.daily_held.filter(h => h.day_n > lastDay);
  if (dh.length) return {kind: "held", n: dh.length, daily: true, items: dh};
  return {kind: "ok"};
}
const lastIdx = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i; return -1; };
const hv = (c, y, n) => { const h = c.history[y]; const x = h && h[n - 1]; return x && x.cum != null && !x.flag ? x.cum : null; };
const hwhy = (c, y, n) => { const h = c.history[y]; const x = h && h[n - 1];
  if (!h) return y === 2018 ? "2018 SOS covers the 30 largest counties only" : "no SOS data";
  if (x && x.flag) return `SOS ${y} data incomplete for this county`; return "no figure"; };

// ---------- list ----------
function renderList() {
  const q = document.getElementById("q").value.trim().toUpperCase();
  const f = document.getElementById("filter").value;
  const btn = (key, label, extra = "") => {
    const c = D.counties.find(x => x.name === key);
    const st = c ? status(c) : {kind: "ok"};
    const dot = st.kind === "held" ? '<span class="dot held" title="Held data"></span>' : st.kind === "nodata" ? '<span class="dot nodata" title="No data"></span>' : "";
    return `<button role="listitem" data-k="${key}" aria-current="${sel === key}"><span>${esc(label)} ${extra}</span>${dot}</button>`;
  };
  let h = "";
  if (!q && f === "all") h += btn("STATEWIDE", "Statewide");
  const t2 = D.counties.filter(c => c.tier === 2), t1 = D.counties.filter(c => c.tier === 1);
  const keep = c => (!q || c.name.includes(q)) && (f !== "held" || status(c).kind === "held") && (f !== "intraday" || c.tier === 2);
  const a = t2.filter(keep), b = t1.filter(keep);
  if (a.length) h += `<div class="grp">Intraday</div>` + a.map(c => btn(c.name, title(c.name), '<span class="tag">2h</span>')).join("");
  if (b.length) h += `<div class="grp">Daily (SOS)</div>` + b.map(c => btn(c.name, title(c.name))).join("");
  if (!h) h = `<div class="empty">No counties match.</div>`;
  const el = document.getElementById("list"); el.innerHTML = h;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { sel = b.dataset.k; dayPick = null; location.hash = sel; renderList(); render(); });
}

// ---------- charts ----------
function axisNice(max) { if (max <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function kfmt(v) { return v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : String(v); }

function dailyChart(c, isState) {
  const W = 760, H = 270, L = 52, R = 16, T = 12, B = 30;
  const series = {};
  if (isState) {
    for (const y of YEARS) { const h = D.statewide_history[y]; if (h && y !== 2018) series[y] = h.map(x => x && x.cum != null && !x.flag ? x.cum : null); }
    series[2026] = D.statewide.map(r => r ? r.cum : null);
  } else {
    for (const y of YEARS) series[y] = Array.from({length: 12}, (_, i) => hv(c, y, i + 1));
    series[2026] = c.daily;
  }
  let today = null;
  if (!isState && c.tier === 2 && c.intraday.readings.length) {
    const last = c.intraday.readings.at(-1), n = dayOf(last.t);
    if (n >= 1 && n <= 12 && c.daily[n - 1] == null) today = {n, v: last.cum, t: last.t};
  }
  const all = Object.values(series).flat().filter(v => v != null).concat(today ? [today.v] : []);
  if (!all.length) return `<div class="empty">No daily figures yet.</div>`;
  const ymax = axisNice(Math.max(...all) * 1.05);
  const x = n => L + (n - 1) * (W - L - R) / 11, y = v => T + (H - T - B) * (1 - v / ymax);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative in-person votes by day of early voting">`;
  if (!isState && c.sos_check) for (const k of c.sos_check.filter(k => k.flag)) {
    s += `<rect x="${x(k.day_n) - 14}" y="${T}" width="28" height="${H - T - B}" fill="url(#stripe)"><title>Day ${k.day_n}: last intraday reading ${fmt(k.intraday)} vs SOS ${fmt(k.sos)} (${fmtPct(k.diff)}). Differs by more than 5%.</title></rect>`;
  }
  s += `<defs><pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="var(--stripe)"/></pattern></defs>`;
  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  for (let n = 1; n <= 12; n++) s += `<text x="${x(n)}" y="${H - 10}" text-anchor="middle">D${n}</text>`;
  for (const yr of [...YEARS.filter(y => series[y]).reverse(), 2026]) {
    const pts = series[yr]; let d = "", pen = false;
    pts.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i + 1) + " " + y(v); pen = true; });
    const w = yr === 2026 ? 3 : 1.75;
    s += `<path d="${d}" fill="none" stroke="${COLOR(yr)}" stroke-width="${w}" stroke-linejoin="round"/>`;
    pts.forEach((v, i) => { if (v != null) s += `<circle cx="${x(i + 1)}" cy="${y(v)}" r="${yr === 2026 ? 3.5 : 2.5}" fill="${COLOR(yr)}"><title>${yr} Day ${i + 1}: ${fmt(v)}</title></circle>`; });
  }
  if (today) s += `<circle cx="${x(today.n)}" cy="${y(today.v)}" r="5" fill="var(--panel)" stroke="var(--y2026)" stroke-width="2" stroke-dasharray="2 2"><title>2026 Day ${today.n} so far: ${fmt(today.v)} (intraday, ${tfmt(today.t)})</title></circle>`;
  if (!isState) for (const h of c.daily_held) s += `<circle cx="${x(h.day_n)}" cy="${T + 6}" r="5" fill="none" stroke="var(--held)" stroke-width="2"><title>HELD: SOS Day ${h.day_n} value ${fmt(h.value)} rejected — ${esc(h.reason)}</title></circle>`;
  s += `</svg>`;
  const leg = [2026, ...YEARS.filter(y => series[y])].map(y => `<span><i style="border-color:${COLOR(y)}"></i>${y}</span>`).join("")
    + (today ? `<span>◌ 2026 today so far (intraday)</span>` : "")
    + (!isState && c.sos_check && c.sos_check.some(k => k.flag) ? `<span><span class="swatch" style="background:var(--stripe)"></span>intraday ≠ SOS by &gt;5%</span>` : "");
  return s + `<div class="legend">${leg}</div>`;
}

function intradayChart(c, n) {
  const I = c.intraday, date = new Date(Date.UTC(2026, 9, 18 + n)).toISOString().slice(0, 10);
  const hrs = I.hours[date] || ["07:00", "19:00"];
  const toM = s => +s.slice(0, 2) * 60 + +s.slice(3);
  const x0 = toM(hrs[0]) - 30, x1 = toM(hrs[1]) + 90;
  const reads = I.readings.filter(r => dayOf(r.t) === n);
  const held = I.held.filter(h => dayOf(h.t || h.scraped) === n);
  const nod = I.no_data.filter(a => dayOf(a.t) === n);
  const prevEOD = I.readings.filter(r => dayOf(r.t) < n).at(-1);
  const refs = YEARS.map(y => ({y, v: hv(c, y, n), prev: n > 1 ? hv(c, y, n - 1) : 0})).filter(r => r.v != null);
  const wb = I.history.filter(h => h.day_n === n);
  const vals = [...reads.map(r => r.cum), ...refs.map(r => r.v), ...wb.map(w => w.cum), prevEOD ? prevEOD.cum : 0];
  const ymin = 0, ymax = axisNice(Math.max(1, ...vals) * 1.05);
  const W = 760, H = 290, L = 52, R = 118, T = 12, B = 30;
  const x = m => L + (Math.min(Math.max(m, x0), x1) - x0) * (W - L - R) / (x1 - x0), y = v => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Intraday cumulative in-person votes, Day ${n}">`;
  s += `<rect x="${x(toM(hrs[0]))}" y="${T}" width="${x(toM(hrs[1])) - x(toM(hrs[0]))}" height="${H - T - B}" fill="var(--grid)" opacity=".45"><title>Polls open ${hrs[0]}–${hrs[1]}</title></rect>`;
  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  for (let m = Math.ceil(x0 / 120) * 120; m <= x1; m += 120) { const hh = m / 60, lab = (hh % 12 || 12) + (hh < 12 ? "a" : "p"); s += `<text x="${x(m)}" y="${H - 10}" text-anchor="middle">${lab}</text>`; }
  for (const r of refs) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${COLOR(r.y)}" stroke-dasharray="5 4" stroke-width="1.5"><title>${r.y} full Day ${n} (SOS end of day): ${fmt(r.v)}</title></line>`;
    s += `<text x="${W - R + 6}" y="${y(r.v) + 4}" style="fill:${COLOR(r.y)}">${r.y} EOD ${kfmt(r.v)}</text>`;
  }
  for (const w of wb) { const m = toM(w.time); s += `<rect x="${x(m) - 4}" y="${y(w.cum) - 4}" width="8" height="8" fill="${COLOR(w.year)}" transform="rotate(45 ${x(m)} ${y(w.cum)})"><title>${w.year} Day ${n} at ${w.time}: ${fmt(w.cum)} (Wayback snapshot)</title></rect>`; }
  // 2026 accepted line (starts from last accepted reading of the prior day, carried to open).
  const pts = reads.map(r => [x(minsCT(r.t)), y(r.cum), r]);
  if (prevEOD) pts.unshift([x(toM(hrs[0])), y(prevEOD.cum), null]); else if (n === 1) pts.unshift([x(toM(hrs[0])), y(0), null]);
  if (pts.length) s += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join("")}" fill="none" stroke="var(--y2026)" stroke-width="3" stroke-linejoin="round"/>`;
  for (const [px, py, r] of pts) if (r) s += `<circle cx="${px}" cy="${py}" r="4" fill="var(--y2026)"><title>${tfmt(r.t)}: ${fmt(r.cum)}${r.lt ? ` · ${r.lr}/${r.lt} sites` : ""}</title></circle>`;
  // Held readings: dashed continuation at the last valid level, hollow amber markers.
  const lastPt = pts.at(-1);
  const heldAfter = held.filter(h => !lastPt || !lastPt[2] || new Date(h.scraped) > new Date(lastPt[2].scraped));
  if (heldAfter.length && lastPt) {
    const xe = x(Math.max(...heldAfter.map(h => minsCT(h.t || h.scraped))));
    s += `<line x1="${lastPt[0]}" y1="${lastPt[1]}" x2="${xe}" y2="${lastPt[1]}" stroke="var(--held)" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  }
  for (const h of held) {
    const px = x(minsCT(h.t || h.scraped)), py = lastPt ? lastPt[1] : y(0);
    s += `<circle cx="${px}" cy="${py}" r="6" fill="var(--panel)" stroke="var(--held)" stroke-width="2.5"><title>HELD ${tfmt(h.t || h.scraped)}: rejected value ${fmt(h.value)} — ${esc(h.reason)}</title></circle>`;
  }
  for (const a of nod) { const px = x(minsCT(a.t)); s += `<line x1="${px}" x2="${px}" y1="${T}" y2="${H - B}" stroke="var(--nodata)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${px}" y="${T + 10}" text-anchor="middle" style="fill:var(--nodata);font-weight:700">×<title>NO DATA ${tfmt(a.t)}: ${esc(a.detail)}</title></text>`; }
  s += `</svg>`;
  const leg = `<span><i style="border-color:var(--y2026)"></i>2026 accepted readings</span>` + refs.map(r => `<span><i style="border-color:${COLOR(r.y)};border-top-style:dashed"></i>${r.y} end of Day ${n}</span>`).join("")
    + (wb.length ? `<span>◆ same-hour snapshot (Wayback)</span>` : "")
    + `<span style="color:var(--held)">○ held (not counted)</span><span style="color:var(--nodata)">× no data</span>`;
  return s + `<div class="legend">${leg}</div>`;
}

// ---------- comparisons ----------
function compareCards(c, isState) {
  let out = "";
  for (const y of YEARS) {
    let v = null, basis = "", now = null, then = null, note = "";
    if (isState) {
      const n = lastIdx(D.statewide.map(r => r && r.cum)) + 1;
      const row = n ? D.statewide[n - 1] : null, cmp = row && row.compare[y];
      if (cmp) { now = cmp.now; then = cmp.then; basis = `SOS end of Day ${n} · ${cmp.counties} counties with data both years${y === 2018 ? " (2018 = top 30 only)" : ""}`; }
      else note = n ? "no comparable counties" : "first SOS end-of-day figure posts tomorrow morning";
    } else if (c.tier === 2 && c.intraday.readings.length) {
      const r = c.intraday.readings.at(-1), n = dayOf(r.t), m = minsCT(r.t);
      const wb = c.intraday.history.filter(h => h.year === y && h.day_n === n).map(h => ({...h, d: Math.abs((+h.time.slice(0, 2) * 60 + +h.time.slice(3)) - m)})).filter(h => h.d <= 60).sort((a, b) => a.d - b.d)[0];
      now = r.cum;
      if (wb) { then = wb.cum; basis = `same hour, Day ${n} (${wb.time} Wayback snapshot)`; }
      else {
        const eod = hv(c, y, n);
        if (eod != null) { then = eod; basis = `vs <b>full</b> Day ${n} (SOS end of day). Day ${n} still in progress`; v = "eod"; }
        else note = hwhy(c, y, n);
      }
    } else {
      const n = lastIdx(c.daily) + 1;
      if (n) { now = c.daily[n - 1]; then = hv(c, y, n); basis = `SOS end of Day ${n}`; if (then == null) note = hwhy(c, y, n); }
      else note = "first SOS end-of-day figure posts tomorrow morning";
    }
    let body;
    if (now != null && then != null) {
      const p = pct(now, then);
      body = v === "eod"
        ? `<div class="v num">${fmt(then)}</div><div class="s">Today is at <b>${(now / then * 100).toFixed(0)}%</b> of it so far</div>`
        : `<div class="v num"><span class="delta ${p >= 0 ? "up" : "down"}">${fmtPct(p)}</span></div><div class="s num">${fmt(now)} now vs ${fmt(then)}</div>`;
    } else body = `<div class="v" style="color:var(--faint)">n/a</div>`;
    out += `<div class="card cmp"><div class="k"><span class="swatch" style="background:${COLOR(y)}"></span>vs ${y}</div>${body}<div class="s">${basis || esc(note)}</div></div>`;
  }
  return out;
}

// ---------- views ----------
function render() {
  const m = document.getElementById("main");
  if (sel === "STATEWIDE") return renderState(m);
  const c = D.counties.find(x => x.name === sel); if (!c) { sel = "STATEWIDE"; return render(); }
  const st = status(c);
  const badge = st.kind === "held" ? `<span class="badge held">HELD</span>` : st.kind === "nodata" ? `<span class="badge nodata">NO DATA</span>` : `<span class="badge ok">OK</span>`;
  const flagged = c.sos_check && c.sos_check.some(k => k.flag);
  let h = `<div class="title"><h2>${title(c.name)} County</h2>${badge}${flagged ? '<span class="badge flag">INTRADAY ≠ SOS</span>' : ""}</div>`;
  h += `<div class="sub">${c.tier === 2 ? "Intraday: county feed, first read 2.5 h after polls open, then every 2 h until 30 min after close." : "Daily: Texas SOS end-of-day figure, posted the following morning."} Registered voters: ${fmt(c.registered)}.</div>`;
  if (st.kind === "held") h += `<div class="notice"><b>${st.n} reading${st.n > 1 ? "s" : ""} held.</b> ${st.daily ? "The SOS figure failed validation and is not shown." : `Showing the last valid reading${st.since ? ` (${tfmt(st.since)})` : ""}.`} ${st.items.map(i => esc(i.reason)).join("; ")}</div>`;
  if (st.kind === "nodata") h += `<div class="notice red"><b>No data since ${dfmt(st.since)}.</b> The county source could not be read: ${esc(st.detail)}</div>`;

  let main = "";
  if (c.tier === 2 && c.intraday.readings.length) {
    const r = c.intraday.readings.at(-1);
    main = `<div class="card now ${st.kind === "held" ? "held" : st.kind === "nodata" ? "nodata" : ""}"><div class="k">In person so far ${st.kind === "held" ? '<span class="badge held" style="margin-left:4px">HELD</span>' : ""}</div><div class="v num">${fmt(r.cum)}</div><div class="s">${st.kind === "held" ? `last valid ${tfmt(r.t)}` : `as of ${dfmt(r.t)}`} · Day ${dayOf(r.t)}${r.lt ? ` · ${r.lr}/${r.lt} sites reporting` : ""}</div></div>`;
  } else {
    const n = lastIdx(c.daily) + 1;
    main = `<div class="card now ${st.kind === "held" ? "held" : ""}"><div class="k">In person, SOS</div><div class="v num">${n ? fmt(c.daily[n - 1]) : "—"}</div><div class="s">${n ? `through end of Day ${n}` : "Day 1 figure posts tomorrow morning"}</div></div>`;
  }
  h += `<div class="grid">${main}${compareCards(c, false)}</div>`;

  if (c.tier === 2) {
    const days = [...new Set([...c.intraday.readings.map(r => dayOf(r.t)), ...c.intraday.held.map(r => dayOf(r.t || r.scraped)), ...c.intraday.no_data.map(r => dayOf(r.t))])].filter(n => n >= 1 && n <= 12).sort((a, b) => a - b);
    if (dayPick == null || !days.includes(dayPick)) dayPick = days.at(-1) || 1;
    h += `<div class="panel"><h3>Through the day</h3><div class="hint">Cumulative in-person votes. Dashed lines are each past year's end-of-day total for the same Day N; diamonds are same-hour snapshots where the Wayback Machine has one.</div>
      <div class="chips">${days.map(n => `<button data-day="${n}" aria-pressed="${n === dayPick}">Day ${n}</button>`).join("")}</div>${intradayChart(c, dayPick)}</div>`;
  }
  h += `<div class="panel"><h3>By day of early voting</h3><div class="hint">SOS cumulative in-person votes at the end of each Day N. Past years are aligned by day of early voting, not calendar date.</div>${dailyChart(c, false)}</div>`;
  if (c.tier === 2) h += readingsTable(c);
  if (c.daily_held.length) h += `<div class="panel"><h3>Held SOS figures</h3><table><tr><th>Day</th><th class="r">Rejected value</th><th>Reason</th></tr>${c.daily_held.map(x => `<tr class="held"><td>Day ${x.day_n}</td><td class="r num">${fmt(x.value)}</td><td>${esc(x.reason)}</td></tr>`).join("")}</table></div>`;
  h += foot();
  m.innerHTML = h;
  m.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { dayPick = +b.dataset.day; render(); });
}

function readingsTable(c) {
  const I = c.intraday;
  const rows = [
    ...I.readings.map(r => ({t: r.scraped, src: r.t, cls: "", st: "OK", v: fmt(r.cum), loc: r.lt ? `${r.lr}/${r.lt}` : "—", note: ""})),
    ...I.held.map(r => ({t: r.scraped, src: r.t, cls: "held", st: "HELD", v: fmt(r.value), loc: "", note: r.reason})),
    ...I.no_data.map(r => ({t: r.t, src: "", cls: "nodata", st: "NO DATA", v: "—", loc: "", note: r.detail})),
  ].sort((a, b) => new Date(b.t) - new Date(a.t)).slice(0, 40);
  if (!rows.length) return "";
  return `<div class="panel"><h3>Readings</h3><div class="hint">Held and no-data rows are never counted.</div><table><tr><th>Read at</th><th>Source updated</th><th>Status</th><th class="r">In person</th><th class="r">Sites</th><th>Note</th></tr>
    ${rows.map(r => `<tr class="${r.cls}"><td>${dfmt(r.t)}</td><td>${r.src ? tfmt(r.src) : ""}</td><td>${r.st}</td><td class="r num">${r.v}</td><td class="r num">${r.loc}</td><td>${esc(r.note)}</td></tr>`).join("")}</table></div>`;
}

// ---------- live counties panel (Statewide view) ----------
const ctNow = () => { const [d, t] = new Date().toLocaleString("en-CA", {timeZone: "America/Chicago", hour12: false}).split(", "); const [hh, mm] = t.split(":"); return {date: d, mins: (+hh % 24) * 60 + +mm}; };
const toMin = s => +s.slice(0, 2) * 60 + +s.slice(3, 5);
const hm = s => { const h = +s.slice(0, 2), m = s.slice(3, 5); return `${h % 12 || 12}${m !== "00" ? ":" + m : ""} ${h < 12 ? "AM" : "PM"}`; };
const ago = iso => { const min = Math.round((Date.now() - new Date(iso)) / 6e4); return min < 1 ? "just now" : min < 60 ? `${min} min ago` : min < 600 ? `${Math.floor(min / 60)} h ${min % 60} min ago` : dfmt(iso); };
const dateOfDay = n => new Date(Date.UTC(2026, 9, 18 + n)).toISOString().slice(0, 10);
const p1 = v => (v * 100).toFixed(1) + "%";
const big = v => v >= 1e6 ? (v / 1e6).toFixed(2) + " million" : fmt(v);
const niceScale = v => [.01, .02, .03, .04, .05, .06, .08, .1, .12, .15, .2, .25, .3, .4, .5, .6, .75, 1].find(s => s >= v * 1.08) || 1;

function liveRow(c) {
  const r = c.intraday.readings.at(-1), st = status(c), n = r ? dayOf(r.t) : null, now = ctNow();
  const hrs = n ? c.intraday.hours[dateOfDay(n)] : null, th = c.intraday.hours[now.date];
  const pol = !th ? {cls: "off", txt: "No early voting today"}
    : now.mins < toMin(th[0]) ? {cls: "off", txt: `Opens ${hm(th[0])}`}
    : now.mins < toMin(th[1]) ? {cls: "open", txt: `Polls open until ${hm(th[1])}`}
    : {cls: "off", txt: `Polls closed at ${hm(th[1])}`};
  const final = !!(r && hrs && minsCT(r.t) >= toMin(hrs[1]));   // source updated at or after close: day is complete
  const v24 = n ? hv(c, 2024, n) : null, v22 = n ? hv(c, 2022, n) : null;
  const h24 = n && c.history[2024] && c.history[2024][n - 1], t24 = v24 != null && h24.reg ? v24 / h24.reg : null;
  let pace = null;
  if (r && v24) {
    const k = r.cum / v24, tip = `2024 end of Day ${n}: ${fmt(v24)}${v22 ? ` · 2022: ${fmt(v22)}` : ""}`;
    pace = final ? {cls: k >= 1 ? "up" : "down", txt: `${k >= 1 ? "▲" : "▼"} ${Math.abs((k - 1) * 100).toFixed(0)}% ${k >= 1 ? "above" : "below"} 2024's Day ${n}`, tip}
      : k >= 1 ? {cls: "up", txt: `▲ Already past 2024's full Day ${n}`, tip}
      : {cls: "prog", txt: `${(k * 100).toFixed(0)}% of 2024's full Day ${n} so far`, tip};
    // Polls have closed but the after-close reading (30 min past close) isn't in yet.
    if (!final && th && hrs === th && now.mins >= toMin(th[1])) { const due = toMin(th[1]) + 30; pace.txt += ` · final count due about ${hm(`${String(Math.floor(due / 60)).padStart(2, "0")}:${String(due % 60).padStart(2, "0")}`)}`; }
  }
  return {c, r, st, n, pol, final, v24, t24, pace, inc: !t2Off.has(c.name), tp: r ? r.cum / c.registered : null};
}

function livePanel() {
  const all = D.counties.filter(c => c.tier === 2).map(liveRow);
  if (!all.length) return "";
  const share = t2Mode === "share";
  const on = all.filter(x => x.inc && x.r);
  const tot = on.reduce((a, x) => a + x.r.cum, 0), reg = on.reduce((a, x) => a + x.c.registered, 0);
  for (const x of all) { x.sh = x.inc && x.r && tot ? x.r.cum / tot : null; x.rsh = x.inc && x.r && reg ? x.c.registered / reg : null; }
  const cmp = on.filter(x => x.v24 != null), nowC = cmp.reduce((a, x) => a + x.r.cum, 0), then = cmp.reduce((a, x) => a + x.v24, 0);
  const days = [...new Set(on.map(x => x.n))], dayTxt = days.length === 1 ? `Day ${days[0]}` : "each county's latest day";
  const nOpen = on.filter(x => x.pol.cls === "open").length;
  const openTxt = !nOpen ? "" : nOpen === on.length ? ", and polls are still open" : `, and polls are still open in ${nOpen} of them`;

  // Headline in plain words.
  let lede;
  if (!on.length) lede = all.some(x => x.r) ? "Tick at least one county below to see totals." : "No live readings yet today. The first reading comes 2½ hours after polls open.";
  else if (!share) {
    lede = `<b>${big(tot)}</b> people have voted in person so far in the <b>${on.length}</b> ${on.length === 1 ? "county" : "counties"} we read live: <b>${p1(tot / reg)}</b> of their ${big(reg)} registered voters.`;
    if (then) lede += ` That's <b>${Math.round(nowC / then * 100)}%</b> of the in-person total ${cmp.length === on.length ? "these counties" : `${cmp.length} of them`} had reached by the end of ${dayTxt} in 2024${openTxt}.`;
  } else {
    const top = [...on].sort((a, b) => b.sh - a.sh)[0], over = [...on].sort((a, b) => (b.sh - b.rsh) - (a.sh - a.rsh))[0];
    lede = `Of the <b>${big(tot)}</b> in-person votes cast so far across the ${on.length} checked counties, <b>${title(top.c.name)}</b> cast the most: <b>${p1(top.sh)}</b>`;
    if (on.length > 1 && over.sh - over.rsh > .005) lede += over === top
      ? `, from only ${p1(top.rsh)} of the registered voters. That makes it the county voting furthest above its weight.`
      : `. <b>${title(over.c.name)}</b> is voting furthest above its weight: ${p1(over.sh)} of the votes from ${p1(over.rsh)} of the registered voters.`;
    else lede += ".";
  }

  const order = {votes: (a, b) => (b.r ? b.r.cum : -1) - (a.r ? a.r.cum : -1), turnout: (a, b) => (b.tp ?? -1) - (a.tp ?? -1), name: (a, b) => a.c.name.localeCompare(b.c.name)}[t2Sort];
  const rows = [...all].sort(order);
  const scale = niceScale(Math.max(.001, ...rows.flatMap(x => share ? [x.sh || 0, x.rsh || 0] : [x.tp || 0, x.t24 || 0])));
  const w = v => Math.min(100, v / scale * 100).toFixed(2);

  let h = `<div class="panel live"><div class="live-head"><h3>Live counties, right now</h3><span class="hint" style="margin:0">Read from each county's own feed every 2 hours while polls are open</span></div>
    <p class="lede">${lede}</p>
    <div class="live-ctl">
      <div class="seg" role="group" aria-label="What the bars show"><button data-mode="reg" aria-pressed="${!share}">Turnout so far</button><button data-mode="share" aria-pressed="${share}">Share of the votes</button></div>
      <div class="sorter" role="group" aria-label="Sort counties"><span>Sort</span>${[["votes", "Most votes"], ["turnout", "Highest turnout"], ["name", "A–Z"]].map(([k, l]) => `<button data-sort="${k}" aria-pressed="${t2Sort === k}">${l}</button>`).join("")}</div>
    </div>`;

  if (share && on.length) {
    const segs = [...on].sort((a, b) => b.sh - a.sh);
    h += `<div class="comp" role="img" aria-label="Share of in-person votes by county">${segs.map((x, i) => `<div style="flex:${x.sh} 0 0;background:${i % 2 ? "var(--y2026-soft)" : "var(--y2026)"}" title="${title(x.c.name)}: ${p1(x.sh)} of the votes (${fmt(x.r.cum)})">${x.sh >= Math.max(.09, (x.c.name.length + 4) * .012) ? `<span>${title(x.c.name)} ${Math.round(x.sh * 100)}%</span>` : ""}</div>`).join("")}</div>`;
  }

  h += `<div class="lrows"><div class="lrow lhdr" aria-hidden="true"><span class="pick"></span><span class="who">County</span><span class="barcol"><span>0</span><span>${Math.round(scale * 100)}%</span></span><span class="big">${share ? "Share" : "Turnout"}</span></div>`;
  for (const x of rows) {
    const {c, r, st} = x, name = title(c.name);
    const badge = st.kind === "held" ? `<span class="badge held">HELD</span>` : st.kind === "nodata" ? `<span class="badge nodata">NO DATA</span>` : "";
    const meta = r ? `<b class="num">${fmt(r.cum)}</b> voted · updated ${ago(r.t)}${st.kind === "held" ? " (last valid)" : ""}` : "No reading yet";
    let bar, val, note;
    if (!share) {
      val = r ? p1(x.tp) : "—";
      bar = r ? `<div class="fill" style="width:${w(x.tp)}%"></div>` + (x.t24 != null ? `<div class="tick" style="left:${w(x.t24)}%" title="2024: ${p1(x.t24)} of registered voters by the end of Day ${x.n} (${fmt(x.v24)} votes)"></div>` : "") : "";
      note = x.pace ? `<span class="pace ${x.pace.cls}" title="${x.pace.tip}">${x.pace.txt}</span>` : r ? `<span class="pace">No 2024 figure for Day ${x.n}</span>` : "";
    } else {
      val = x.sh != null ? p1(x.sh) : "—";
      bar = x.sh != null ? `<div class="fill" style="width:${w(x.sh)}%"></div><div class="tick reg" style="left:${w(x.rsh)}%" title="${p1(x.rsh)} of the registered voters in the checked counties"></div>` : "";
      const d = x.sh != null ? (x.sh - x.rsh) * 100 : null;
      note = !x.inc ? `<span class="pace">Not counted. Tick the box to include it</span>` : d == null ? "" : `<span class="pace ${Math.abs(d) < .05 ? "" : d > 0 ? "up" : "down"}">${p1(x.rsh)} of registered voters · ${d >= 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(1)} pts ${d >= 0 ? "above" : "below"} its weight</span>`;
    }
    h += `<div class="lrow ${x.inc ? "" : "off"}">
      <label class="pick"><input type="checkbox" data-pick="${c.name}" ${x.inc ? "checked" : ""}><span class="sr">Count ${name} in the totals</span></label>
      <div class="who"><a href="#${c.name}" data-k="${c.name}">${name}</a>${badge}<div class="meta"><span class="pol ${x.pol.cls}"><i></i>${x.pol.txt}</span></div><div class="meta">${meta}</div></div>
      <div class="barcol"><div class="track">${bar}</div><div class="note">${note}</div></div>
      <div class="big num">${val}</div></div>`;
  }
  if (on.length) {
    const combined = share ? "100%" : p1(tot / reg);
    h += `<div class="lrow total"><span class="pick"></span><div class="who">All checked (${on.length})<div class="meta"><b class="num">${fmt(tot)}</b> voted of ${fmt(reg)} registered</div></div>
      <div class="barcol">${share ? "" : `<div class="track"><div class="fill" style="width:${w(tot / reg)}%"></div></div>`}<div class="note">${!share && then ? `<span class="pace ${nowC >= then ? "up" : "prog"}">${Math.round(nowC / then * 100)}% of the same counties' 2024 total by the end of ${dayTxt}</span>` : ""}</div></div>
      <div class="big num">${combined}</div></div>`;
  }
  h += `</div><div class="legend">${share
    ? `<span><b class="sw fill"></b>Share of the votes cast</span><span><b class="sw tick reg"></b>Share of the registered voters. A bar past its line means the county is voting above its weight</span>`
    : `<span><b class="sw fill"></b>2026 so far</span><span><b class="sw tick"></b>2024, end of the same day of early voting</span><span><span class="dotlive"></span>polls open now</span>`}</div>
    <details class="how"><summary>How to read this</summary><ul>
      <li><b>Turnout</b> is in-person early votes so far divided by registered voters. Mail ballots are not included.</li>
      <li>The <b>orange line</b> on each bar marks where that county stood at the end of the same day of early voting in 2024. A bar that reaches past its line is ahead of 2024.</li>
      <li>While polls are open, today's count is compared with all of 2024's day, so "% of 2024's full day" keeps climbing until close. After close it turns into a final ▲ above / ▼ below.</li>
      <li><b>Share of the votes</b> splits the checked counties' combined votes. The grey line is each county's share of the registered voters, so a bar that passes its line means that county is turning out above its weight.</li>
      <li>Untick a county to leave it out of the totals and shares.</li>
      <li>Each county is read from its own official feed, so update times differ by up to two hours. Nothing is estimated: a reading that fails a check is held, and the last valid number stays.</li>
    </ul></details></div>`;
  return h;
}

function renderState(m) {
  const n = lastIdx(D.statewide.map(r => r && r.cum)) + 1, row = n ? D.statewide[n - 1] : null;
  const held = D.counties.filter(c => status(c).kind === "held"), nod = D.counties.filter(c => status(c).kind === "nodata");
  let h = `<div class="title"><h2>Statewide</h2>${held.length ? `<span class="badge held">${held.length} HELD</span>` : ""}${nod.length ? `<span class="badge nodata">${nod.length} NO DATA</span>` : ""}</div>`;
  h += `<div class="sub">${row ? "Sum of all 254 counties from the Texas SOS end-of-day figures. Each comparison uses only counties with a valid figure in both years." : "The Texas SOS posts each day's statewide figure the next morning. Until then, the live counties below are the freshest numbers."}</div>`;
  const cards = `<div class="grid"><div class="card now"><div class="k">In person, SOS</div><div class="v num">${row ? fmt(row.cum) : "—"}</div><div class="s">${row ? `through end of Day ${n} · ${row.counties} counties reported` : "Day 1 statewide figure posts tomorrow morning"}</div></div>${compareCards(null, true)}</div>`;
  // Until the first SOS end-of-day figure exists, the live counties are the only numbers: lead with them.
  h += row ? cards + livePanel() : livePanel() + cards;
  h += `<div class="panel"><h3>By day of early voting</h3><div class="hint">Statewide SOS cumulative in-person votes. 2018 isn't drawn because the SOS only published the 30 largest counties that year.</div>${dailyChart(null, true)}</div>`;
  if (held.length || nod.length) h += `<div class="panel"><h3>Counties with held or missing data</h3><table><tr><th>County</th><th>Status</th><th>Detail</th></tr>${[...held, ...nod].map(c => { const st = status(c); return `<tr class="${st.kind}"><td><a href="#${c.name}" data-k="${c.name}">${title(c.name)}</a></td><td>${st.kind === "held" ? "HELD" : "NO DATA"}</td><td>${esc(st.kind === "held" ? st.items.map(i => i.reason).join("; ") : st.detail)}</td></tr>`; }).join("")}</table></div>`;
  h += foot();
  const y0 = scrollY;
  m.innerHTML = h;
  scrollTo(0, y0);
  m.querySelectorAll("a[data-k]").forEach(a => a.onclick = e => { e.preventDefault(); sel = a.dataset.k; dayPick = null; location.hash = sel; renderList(); render(); });
  m.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { t2Mode = b.dataset.mode; render(); });
  m.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { t2Sort = b.dataset.sort; render(); });
  const how = m.querySelector("details.how"); if (how) { how.open = howOpen; how.ontoggle = () => { howOpen = how.open; }; }
  m.querySelectorAll("[data-pick]").forEach(b => b.onchange = () => { b.checked ? t2Off.delete(b.dataset.pick) : t2Off.add(b.dataset.pick); render(); });
}

function foot() {
  return `<div class="foot"><b>Sources.</b> Texas Secretary of State early-voting turnout (2026 live feed; 2024 &amp; 2022 from the SOS archive; 2018 SOS pages, 30 largest counties). Dallas County Vote Center Finder (ArcGIS). Travis County Clerk live turnout tracker (ElectionLink). In-person votes only; mail ballots are excluded.<br>
  <b>Validation.</b> A reading is held, not shown, if it drops below the last valid count, jumps faster than 3× the fastest pace so far, exceeds registered voters, or reports more sites than exist. Nothing is estimated or corrected. Raw logs and rules: <a href="https://github.com/Seeker-Cliff/tx-early-vote-live">GitHub</a>.</div>`;
}

// ---------- boot ----------
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("theme")); } catch (e) {}
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; applyTheme(next); try { localStorage.setItem("theme", next); } catch (e) {}
};
document.getElementById("q").oninput = renderList;
document.getElementById("filter").onchange = renderList;

async function load() {
  try {
    const r = await fetch("data.json?ts=" + Date.now(), {cache: "no-store"});
    D = await r.json();
  } catch (e) { document.getElementById("main").innerHTML = `<div class="notice red">Could not load data.json: ${esc(e.message)}</div>`; return; }
  document.getElementById("meta").textContent = `${D.day_n ? `Day ${D.day_n} of 12` : "Outside early voting"} · data rebuilt ${dfmt(D.generated_at)} CT · refreshes every 5 min`;
  const k = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (k && (k === "STATEWIDE" || D.counties.some(c => c.name === k))) sel = k;
  renderList(); render();
}
load();
setInterval(load, 5 * 60 * 1000);
addEventListener("hashchange", () => {
  const k = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (D && k && k !== sel && (k === "STATEWIDE" || D.counties.some(c => c.name === k))) { sel = k; dayPick = null; renderList(); render(); }
});
</script>
</body>
</html>
